ortant;border:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;width:100%;min-width:0;padding:18px 0!important;color:#1a5edb!important}#individual-subscriptions .waitlist button{border:0;background:#fa72cc;color:#1555c7;border-radius:40px;padding:16px 23px;font:600 13px Poppins,sans-serif;white-space:nowrap;cursor:pointer;display:flex;gap:13px;align-items:center}#individual-subscriptions .waitlist button:hover{background:#f45fc2}#individual-subscriptions .waitlist button span{font-size:23px;line-height:1}#individual-subscriptions .form-status{font-size:10px;margin:9px 0 24px;opacity:.75;min-height:16px}#individual-subscriptions .benefits{display:flex;gap:20px;padding-top:5px}#individual-subscriptions .benefits>div{font-size:11px;line-height:1.6;display:grid;grid-template-columns:34px auto;align-items:center;column-gap:8px}#individual-subscriptions .benefits span{display:grid;place-items:center;grid-row:span 2;background:#aadde2;border-radius:50%;width:34px;height:34px;font-size:22px}#individual-subscriptions .benefits>div:nth-child(2) span{background:#fbc5e9}#individual-subscriptions .individual-art{position:relative;align-self:stretch;min-height:500px;display:flex;align-items:flex-end;justify-content:center}#individual-subscriptions .art-circle{position:absolute;width:410px;height:410px;background:#aadde2;border-radius:50%;top:70px;left:10px}#individual-subscriptions .teens{position:relative;z-index:1;width:338px;max-width:90%;height:auto;display:block}#individual-subscriptions .art-note{font:700 31px EWLMarker,cursive;position:absolute;top:2px;left:55px;transform:rotate(-9deg);z-index:2}#individual-subscriptions .floating-tag{position:absolute;z-index:3;background:#aadde2;padding:15px 20px;color:#1a5edb;font:500 13px/1.5 Poppins,sans-serif;box-shadow:0 7px 20px #1a5edb12;border:2px solid #fef6e9;border-radius:15px;transform:rotate(8deg)}#individual-subscriptions .tag-top{right:-10px;top:126px;background:#fa72cc}#individual-subscriptions .tag-bottom{left:-5px;bottom:25px;transform:rotate(-7deg);display:flex;gap:10px;align-items:center}#individual-subscriptions .tag-bottom span{font-size:38px}#individual-subscriptions .star{position:absolute;color:#fa72cc;font-size:76px;z-index:2;line-height:1}#individual-subscriptions .star-one{left:0;top:50px;transform:rotate(12deg)}#individual-subscriptions .star-two{right:0;bottom:0;color:#1a5edb;font-size:55px}#individual-subscriptions .wave{position:absolute;bottom:-1px;left:0;width:100%;height:50px}#individual-subscriptions .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#individual-subscriptions{font-family:Poppins,sans-serif}#individual-subscriptions *{box-sizing:border-box}#individual-subscriptions .waitlist-honeypot{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}#individual-subscriptions .waitlist-privacy{font-size:11px;line-height:1.7;margin:12px 0 0;max-width:550px}#individual-subscriptions .waitlist-privacy a{text-decoration:underline;color:inherit}#individual-subscriptions .form-status{font-size:12px;opacity:1;margin:9px 0 20px;min-height:20px}#individual-subscriptions .is-error{color:#9a174f}#individual-subscriptions .is-success{color:#145b4a}#individual-subscriptions input[aria-invalid=true]{outline:2px solid #9a174f!important}#individual-subscriptions button:disabled{opacity:.65;cursor:wait}#individual-subscriptions :focus-visible{outline:3px solid #1a5edb!important;outline-offset:3px}#individual-subscriptions .teens{height:auto!important}#individual-subscriptions .star-one{top:15px}#individual-subscriptions h2{font-weight:700!important}@media(max-width:850px){#individual-subscriptions .individual-inner{grid-template-columns:1fr;padding:45px 26px 75px;gap:25px;max-width:650px}#individual-subscriptions h2{font-size:58px!important}#individual-subscriptions .individual-art{min-height:470px;max-width:430px;width:100%;margin:auto}#individual-subscriptions .teens{width:310px}#individual-subscriptions .art-circle{width:370px;height:370px}#individual-subscriptions .desktop-br{display:none}}@media(max-width:480px){#individual-subscriptions .individual-inner{padding:34px 22px 65px;gap:12px}#individual-subscriptions h2{font-size:48px!important}#individual-subscriptions .intro{font-size:16px}#individual-subscriptions .description{font-size:12px}#individual-subscriptions .waitlist{flex-direction:column}#individual-subscriptions .waitlist button{justify-content:center}#individual-subscriptions .benefits{justify-content:space-between;gap:9px}#individual-subscriptions .benefits>div{font-size:9px;display:flex;flex-direction:column;text-align:center;gap:7px}#individual-subscriptions .individual-art{min-height:410px}#individual-subscriptions .art-circle{width:310px;height:310px;left:0}#individual-subscriptions .teens{width:265px}#individual-subscriptions .tag-top{right:0;font-size:11px}#individual-subscriptions .tag-bottom{left:0;font-size:11px}#individual-subscriptions .star-one{font-size:55px}}#individual-subscriptions .email-wrap:focus-within{outline:3px solid #1a5edb;outline-offset:3px}</style>
<script>
(() => {
'use strict';
// Enable only after deploying and verifying the Laravel endpoint and migration.
const REGISTRATIONS_OPEN = false;
function mountWaitlist() {
 if (!document.body.classList.contains('home') || document.getElementById('individual-subscriptions')) return;
 const anchor = document.querySelector('.elementor-element-cb707a0');
 if (!anchor) return;
 anchor.insertAdjacentHTML('afterend', "<section class=\"individual\" aria-labelledby=\"individual-title\" id=\"individual-subscriptions\">\n<div class=\"individual-inner\">\n<div class=\"individual-copy\">\n<span class=\"eyebrow\"><i></i> COMING SOON</span>\n<h2 id=\"individual-title\">Individual subscriptions<br><span>Coming soon!</span></h2>\n<p class=\"intro\">Want to access EmpowerED independently,<br class=\"desktop-br\"> without a school subscription?</p>\n<p class=\"description\">Individual subscriptions are coming soon! Register your interest by joining our waitlist below.</p>\n<form class=\"waitlist\" data-endpoint=\"https://admin.empoweredhealth.asia/api/individual-subscription-waitlist\"><label class=\"sr-only\" for=\"waitlist-email\">Email address</label><div class=\"waitlist-honeypot\" aria-hidden=\"true\"><label>Leave this field empty<input type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\"></label></div><div class=\"email-wrap\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m3 6 9 7 9-7\"/></svg><input id=\"waitlist-email\" type=\"email\" placeholder=\"Enter your email address\" required maxlength=\"254\" autocomplete=\"email\" aria-describedby=\"waitlist-status waitlist-privacy\"></div><button type=\"submit\">Join the Waitlist <span aria-hidden=\"true\">↗</span></button></form>\n<p id=\"waitlist-privacy\" class=\"waitlist-privacy\">We’ll store your email to record your interest in individual subscriptions. <a href=\"https://empoweredhealth.asia/privacy-policy/\">Privacy Policy</a>.</p><p id=\"waitlist-status\" class=\"form-status\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"></p>\n<div class=\"benefits\"><div><span>✓</span> Register<br>your interest</div><div><span>☆</span> Be among<br>the first</div><div><span>♡</span> No commitment<br>required</div></div>\n</div>\n<div class=\"individual-art\"><div class=\"art-circle\"></div><div class=\"star star-one\">✳</div><div class=\"star star-two\">✳</div><img class=\"teens\" src=\"https://empoweredhealth.asia/wp-content/uploads/2025/09/Group-1261153370.png\" alt=\"Three EmpowerED teens smiling together\"><div class=\"floating-tag tag-top\">Expert-led.<br>Teen-approved.</div><div class=\"floating-tag tag-bottom\"><span>♡</span> Your pace.<br>Your space.</div></div>\n</div><svg class=\"wave\" viewBox=\"0 0 1440 65\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 24C210-30 375 80 695 38s489-53 745-7v34H0Z\" fill=\"#AADDE2\"/></svg>\n</section>");
 const form = document.querySelector('#individual-subscriptions form.waitlist');
 form.dataset.registrationOpen = String(REGISTRATIONS_OPEN);
 form.querySelector('input[type="email"]').disabled = !REGISTRATIONS_OPEN;
 form.querySelector('button[type="submit"]').disabled = !REGISTRATIONS_OPEN;
 if (!REGISTRATIONS_OPEN) document.querySelector('#waitlist-privacy').firstChild.textContent = 'Registration opens soon. Please check back shortly. ';
 (() => {
  'use strict';
  document.querySelectorAll('#individual-subscriptions form.waitlist').forEach(form => {
    const section = form.closest('section');
    const input = form.querySelector('input[type="email"]');
    const button = form.querySelector('button[type="submit"]');
    const status = section.querySelector('.form-status');
    let submitting = false;

    if (form.dataset.registrationOpen === 'false') return;

    input.addEventListener('input', () => {
      input.removeAttribute('aria-invalid');
      input.setCustomValidity('');
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submitting) return;
      input.value = input.value.trim();
      if (!form.reportValidity()) return;
      submitting = true;
      button.disabled = true;
      form.setAttribute('aria-busy', 'true');
      status.textContent = 'Registering your interest…';
      status.classList.remove('is-error', 'is-success');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(form.dataset.endpoint, {
          method: 'POST',
          credentials: 'omit',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: input.value, website: form.elements.website.value }),
          signal: controller.signal,
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 429) throw new Error('Too many attempts. Please wait and try again later.');
        if (response.status === 422) {
          input.setAttribute('aria-invalid', 'true');
          input.focus();
          throw new Error(data.errors?.email?.[0] || 'Please check your email address and try again.');
        }
        if (!response.ok || data.success !== true) throw new Error('We couldn’t save your registration. Please try again later.');
        status.textContent = data.message;
        status.classList.add('is-success');
        form.reset();
      } catch (error) {
        status.textContent = error.name === 'AbortError'
          ? 'The request timed out. Please try again. If it was saved, your email will only be counted once.'
          : error instanceof TypeError
            ? 'We couldn’t connect. Please check your connection and try again.'
            : error.message;
        status.classList.add('is-error');
      } finally {
        clearTimeout(timer);
        submitting = false;
        button.disabled = false;
        form.removeAttribute('aria-busy');
      }
    });
  });
})();

}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountWaitlist, {once:true});
else mountWaitlist();
})();
</script>
