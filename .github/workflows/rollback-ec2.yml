name: Rollback EC2

on:
  workflow_dispatch:
    inputs:
      archive:
        description: Backup filename (pre-deploy-....tar.gz) or "latest"
        required: true
        default: latest

concurrency:
  group: ec2-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, linux]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous live snapshot
        env:
          APP_PATH: ${{ secrets.APP_PATH || '/var/www/AdminPanel' }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR }}
          BACKUP_KEEP: ${{ secrets.BACKUP_KEEP || 5 }}
          PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}
          PHP_FPM_SERVICE: ${{ secrets.PHP_FPM_SERVICE || 'apache2' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/ec2-release.sh
          ./scripts/deploy/ec2-release.sh list
          ./scripts/deploy/ec2-release.sh rollback "${{ github.event.inputs.archive }}"
