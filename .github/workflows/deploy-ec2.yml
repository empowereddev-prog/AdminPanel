name: Deploy to EC2 (dev)

# Auto-sync on this box is the systemd timer (ec2-autosync.timer), which git-pulls
# sprint1_dev. This workflow is the optional GitHub Actions path: it needs a
# self-hosted runner labeled self-hosted,linux. Do not trigger it on every push
# until that runner is Idle, or jobs will sit queued.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run php artisan migrate --force
        type: boolean
        default: false
      skip_backup:
        description: Skip snapshot of the live deploy (not recommended)
        type: boolean
        default: false

concurrency:
  group: ec2-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: [self-hosted, linux]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot live app, then sync this commit
        env:
          APP_PATH: ${{ secrets.APP_PATH || '/var/www/AdminPanel' }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR }}
          BACKUP_KEEP: ${{ secrets.BACKUP_KEEP || 5 }}
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations || 'false' }}
          SKIP_BACKUP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_backup || 'false' }}
          PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}
          PHP_FPM_SERVICE: ${{ secrets.PHP_FPM_SERVICE || 'apache2' }}
          RELEASE_SRC: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/ec2-release.sh
          ./scripts/deploy/ec2-release.sh deploy-sync
          ./scripts/deploy/ec2-release.sh list

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'http://127.0.0.1/' }}
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTHCHECK_URL" || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Health check failed; rolling back to latest snapshot"
            ./scripts/deploy/ec2-release.sh rollback latest
            exit 1
          fi
