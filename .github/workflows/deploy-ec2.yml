name: Deploy to EC2 (dev)

# Runs ON the EC2 box (self-hosted runner). GitHub-hosted ubuntu-latest cannot
# reach port 22 (dial tcp :22 i/o timeout) unless the security group allows it.
#
# The release is rsynced from the runner's checkout, so APP_PATH does NOT need to
# be a git checkout of any repo. That is what lets this repo take over the deploy
# from the old one without rebuilding the server.
on:
  push:
    branches: [sprint1_dev]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run php artisan migrate --force
        type: boolean
        default: false
      skip_backup:
        description: Skip snapshot of the live deploy (not recommended)
        type: boolean
        default: false

concurrency:
  group: ec2-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      php-version: '8.3'

  deploy:
    needs: ci
    runs-on: [self-hosted, linux]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot live app, then sync this commit
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR }}
          BACKUP_KEEP: ${{ secrets.BACKUP_KEEP || 5 }}
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations || 'false' }}
          SKIP_BACKUP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_backup || 'false' }}
          PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}
          PHP_FPM_SERVICE: ${{ secrets.PHP_FPM_SERVICE }}
          RELEASE_SRC: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/ec2-release.sh
          ./scripts/deploy/ec2-release.sh deploy-sync
          ./scripts/deploy/ec2-release.sh list

      # Only runs when the HEALTHCHECK_URL repository variable is set.
      - name: Smoke test the deployed app
        id: healthcheck
        if: vars.HEALTHCHECK_URL != ''
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "${{ vars.HEALTHCHECK_URL }}" || true)"
            echo "attempt $attempt -> HTTP ${code:-none}"
            if [[ "$code" == "200" ]]; then exit 0; fi
            sleep 5
          done
          echo "::error::Health check never returned 200"
          exit 1

      - name: Auto-rollback on failed health check
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR }}
          PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}
          PHP_FPM_SERVICE: ${{ secrets.PHP_FPM_SERVICE }}
        run: |
          set -euo pipefail
          echo "::warning::Health check failed - restoring the pre-deploy snapshot"
          ./scripts/deploy/ec2-release.sh rollback latest
