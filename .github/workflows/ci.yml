name: CI

on:
  pull_request:
  push:
    branches: [sprint1_dev, main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo, pdo_mysql, gd, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-security-blocking

      - name: PHP syntax check
        run: find app routes config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Audit dependencies
        continue-on-error: true
        run: composer audit
